<div class="registro-container">
  <h2>Cine Prisma - Registro</h2>
  
  <form [formGroup]="registroForm" (ngSubmit)="registrar()">
    <div class="form-group">
      <label for="nombre">Nombre:</label>
      <input type="text" id="nombre" formControlName="nombre" placeholder="Nombre" />
    </div>

    <div class="form-group">
      <label for="apellido">Apellido:</label>
      <input type="text" id="apellido" formControlName="apellido" placeholder="Apellido" />
    </div>

    <div class="form-group">
      <label for="email">Correo Electrónico:</label>
      <input type="email" id="email" formControlName="email" placeholder="correo@ejemplo.com" />
    </div>

    <div class="form-group">
      <label for="password">Contraseña:</label>
      <input type="password" id="password" formControlName="password" placeholder="••••••••" />
    </div>

    <div class="form-group">
      <label for="fecha_nacimiento">Fecha de Nacimiento:</label>
      <input type="date" id="fecha_nacimiento" formControlName="fecha_nacimiento" />
    </div>

    <div class="form-group">
      <label for="tipo_sangre">Tipo de Sangre:</label>
      <input type="text" id="tipo_sangre" formControlName="tipo_sangre" placeholder="Ej: O+" />
    </div>

    <div class="form-group">
      <label for="color_ojos">Color de Ojos:</label>
      <input type="text" id="color_ojos" formControlName="color_ojos" placeholder="Ej: Marrones" />
    </div>

    <div class="form-group">
      <label for="dias_vacaciones">Días de Vacaciones:</label>
      <input type="number" id="dias_vacaciones" formControlName="dias_vacaciones" />
    </div>

    <button type="submit" [disabled]="registroForm.invalid">Registrarse</button>
  </form>

  <p *ngIf="mensaje" class="mensaje">{{ mensaje }}</p>
</div>
